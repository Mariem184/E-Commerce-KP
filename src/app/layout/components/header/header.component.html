<header class="header-container">
  <!-- Right Section: Branch Selector & Search Bar -->
  <div class="header-right-group">
    <!-- Branch Selector Dropdown -->
    <div class="branch-selector">
      <div class="branch-icon-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
      </div>
      <div class="branch-info">
        <span class="branch-label">الفرع الحالي</span>
        <span class="branch-name">فرع المعادي</span>
      </div>
      <svg class="chevron-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </div>

    <!-- Search Input -->
    <div class="header-search">
      <input
        type="text"
        placeholder="ابحث عن منتج أو فاتورة أو عميل"
        class="search-input-field"
      />
      <svg class="search-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
    </div>
  </div>

  <!-- Left Section: Notification & Profile -->
  <div class="header-left-group">
    <!-- Notification Bell -->
    <button class="notif-btn" title="الإشعارات">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>
    </button>

    <!-- User Profile -->
    <div class="user-profile-widget">
      <div class="user-avatar-blue">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </div>
      <div class="user-texts">
        <span class="user-title">اسم الموظف</span>
        <span class="user-subtitle">مدير الفرع</span>
      </div>
    </div>
  </div>
</header>
