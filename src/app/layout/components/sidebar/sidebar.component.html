<aside class="sidebar-wrapper">
  <!-- Store Brand / Header -->
  <div class="sidebar-brand">
    <div class="brand-logo">
      <span class="logo-icon">🏪</span>
    </div>
    <div class="brand-text">
      <h2 class="brand-name">سوق بلس</h2>
      <span class="brand-tagline">إدارة المتاجر المتكاملة</span>
    </div>
  </div>

  <!-- Navigation Links -->
  <nav class="sidebar-nav">
    <div class="nav-section-title">القائمة الرئيسية</div>
    <ul class="nav-list">
      <li *ngFor="let item of navItems" class="nav-item">
        <a
          [routerLink]="item.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.path === '/dashboard' }"
          class="nav-link"
        >
          <span class="nav-icon">{{ item.icon }}</span>
          <div class="nav-text">
            <span class="nav-title-ar">{{ item.labelAr }}</span>
            <span class="nav-title-en">{{ item.labelEn }}</span>
          </div>
          <span
            *ngIf="item.badge"
            class="nav-badge"
            [style.backgroundColor]="item.badgeColor || '#e2e8f0'"
          >
            {{ item.badge }}
          </span>
        </a>
      </li>
    </ul>
  </nav>

  <!-- Sidebar Footer (User / Logout) -->
  <div class="sidebar-footer">
    <div class="user-card" *ngIf="authService.currentUser() as user">
      <img [src]="user.avatarUrl" [alt]="user.name" class="user-avatar" />
      <div class="user-info">
        <span class="user-name">{{ user.name }}</span>
        <span class="user-role">{{ user.role }}</span>
      </div>
    </div>
    <button (click)="logout()" class="logout-btn" title="تسجيل الخروج">
      <span class="logout-icon">🚪</span>
      <span class="logout-text">تسجيل الخروج</span>
    </button>
  </div>
</aside>
