<aside class="sidebar-wrapper">
  <!-- Brand / Header -->
  <div class="sidebar-brand">
    <div class="brand-logo">
      <svg class="logo-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
    </div>
    <span class="brand-title">نظام ادارة المتاجر</span>
  </div>

  <!-- Navigation -->
  <nav class="sidebar-nav">
    <ul class="nav-list">
      <li *ngFor="let item of navItems" class="nav-item">
        <a
          [routerLink]="item.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.path === '/dashboard' }"
          class="nav-link"
        >
          <span class="nav-icon" [innerHTML]="item.svg"></span>
          <span class="nav-title">{{ item.label }}</span>
        </a>
      </li>
    </ul>
  </nav>

  <!-- Logout Footer -->
  <div class="sidebar-footer">
    <button (click)="logout()" class="logout-btn">
      <svg class="logout-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
      <span>تسجيل خروج</span>
    </button>
  </div>
</aside>
