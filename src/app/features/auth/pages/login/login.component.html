<div class="auth-split-container">
  <!-- Right Column: Login Form -->
  <div class="auth-form-column">
    <div class="form-wrapper">
      <div class="form-header">
        <h1 class="auth-title">تسجيل الدخول</h1>
        <p class="auth-subtitle">أدخل بياناتك للمتابعة</p>
      </div>

      <form (ngSubmit)="onSubmit()" class="figma-login-form">
        <!-- Field 1: الأسم الكامل -->
        <div class="form-group">
          <label class="input-label">الأسم الكامل</label>
          <div class="input-with-icon">
            <input
              type="text"
              [(ngModel)]="name"
              name="name"
              placeholder="أدخل اسمك بالكامل"
              class="form-input"
              required
            />
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </div>
        </div>

        <!-- Field 2: كلمة المرور -->
        <div class="form-group">
          <label class="input-label">كلمة المرور</label>
          <div class="input-with-icon">
            <input
              [type]="showPassword ? 'text' : 'password'"
              [(ngModel)]="password"
              name="password"
              placeholder="ادخل كلمه المرور"
              class="form-input"
              required
            />
            <!-- Lock Icon (Right) -->
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <!-- Eye Toggle (Left) -->
            <button type="button" class="eye-toggle-btn" (click)="showPassword = !showPassword">
              <svg *ngIf="!showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
              <svg *ngIf="showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="primary-login-btn">
          <span>تسجيل الدخول</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>

        <!-- Forgot Password Link -->
        <a routerLink="/auth/forget-password" class="forgot-link">نسيت كلمة المرور؟</a>

        <!-- Divider -->
        <div class="divider-or">
          <span class="line"></span>
          <span class="text">أو</span>
          <span class="line"></span>
        </div>

        <!-- Secondary Outline Button -->
        <a routerLink="/auth/sign-up" class="secondary-outline-btn">
          انشاء حساب جديد
        </a>
      </form>
    </div>
  </div>

  <!-- Left Column: Illustration Banner -->
  <div class="auth-banner-column">
    <div class="banner-content">
      <h2 class="banner-headline">مرحبا بعودتك</h2>
      <p class="banner-subtext">سجل دخولك لمتابعة و ادارة متجرك.</p>

      <!-- 3D Graphics Composition -->
      <div class="illustration-container">
        <!-- Floating + Badge -->
        <div class="floating-badge-plus">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </div>

        <!-- Main Credit Card Graphic -->
        <div class="card-3d-back"></div>
        <div class="card-3d-front">
          <div class="card-chip-row">
            <div class="card-avatar-circle">
              <svg viewBox="0 0 24 24" fill="#005bf5">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"></path>
              </svg>
            </div>
            <div class="card-lines">
              <div class="card-line long"></div>
              <div class="card-line short"></div>
            </div>
          </div>
          <div class="card-bottom-row">
            <div class="card-chip"></div>
            <div class="card-dots">•••• ••••</div>
            <div class="card-star">★</div>
          </div>
        </div>

        <!-- Shopping Bag Graphic -->
        <div class="shopping-bag-3d">
          <div class="bag-handle"></div>
          <div class="bag-body">
            <div class="bag-check-circle">
              <svg viewBox="0 0 24 24" fill="none" stroke="#005bf5" stroke-width="3">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            </div>
          </div>
        </div>

        <!-- Gift Box Graphic -->
        <div class="gift-box-3d">
          <div class="gift-lid"></div>
          <div class="gift-body">
            <div class="gift-ribbon-v"></div>
            <div class="gift-ribbon-h"></div>
          </div>
        </div>

        <!-- Decorative Sparks -->
        <span class="spark s1">+</span>
        <span class="spark s2">+</span>
        <span class="spark s3">+</span>
        <span class="spark-diamond d1">✦</span>
        <span class="spark-diamond d2">✦</span>
      </div>
    </div>
  </div>
</div>
