<div class="login-card">
  <div class="login-header">
    <div class="store-badge">🏪 سوق بلس</div>
    <h2>تسجيل الدخول للنظام</h2>
    <p>أدخل بيانات الحساب للوصول إلى لوحة تحكم المتجر</p>
  </div>

  <form (ngSubmit)="onSubmit()" class="login-form">
    <div class="form-group">
      <label>البريد الإلكتروني</label>
      <input
        type="email"
        [(ngModel)]="email"
        name="email"
        required
        placeholder="admin@store.com"
        class="form-control"
      />
    </div>

    <div class="form-group">
      <label>كلمة المرور</label>
      <input
        type="password"
        [(ngModel)]="password"
        name="password"
        required
        placeholder="••••••••"
        class="form-control"
      />
    </div>

    <div class="form-options">
      <label class="checkbox-label">
        <input type="checkbox" [(ngModel)]="rememberMe" name="rememberMe" />
        <span>تذكرني على هذا الجهاز</span>
      </label>
      <a href="javascript:void(0)" class="forgot-link">نسيت كلمة المرور؟</a>
    </div>

    <button type="submit" class="submit-btn">
      <span>دخول للنظام</span>
      <span>←</span>
    </button>

    <div class="demo-hint">
      <span>💡 تجريبي: اضغط دخول مباشرة للوصول إلى النظام بصفة مدير.</span>
    </div>
  </form>
</div>
