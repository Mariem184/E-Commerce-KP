<div class="feature-container">
  <div class="page-header">
    <div>
      <h1 class="page-title">إعدادات النظام والمتجر (Settings)</h1>
      <p class="page-description">البيانات الضريبية، إعدادات طابعة الفواتير، العملة الافتراضية، والشعار</p>
    </div>
    <div class="actions">
      <button class="btn btn-primary">حفظ التغييرات</button>
    </div>
  </div>

  <div class="settings-card">
    <h3>البيانات الأساسية للمتجر</h3>
    <div class="form-grid">
      <div class="form-group">
        <label>اسم المتجر / المنشأة</label>
        <input type="text" [(ngModel)]="storeName" class="form-control" />
      </div>

      <div class="form-group">
        <label>الرقم الضريبي (VAT Number)</label>
        <input type="text" [(ngModel)]="taxNumber" class="form-control" />
      </div>

      <div class="form-group">
        <label>العملة الافتراضية</label>
        <select [(ngModel)]="currency" class="form-control">
          <option value="SAR">ريال سعودي (ر.س)</option>
          <option value="EGP">جنيه مصري (ج.م)</option>
          <option value="USD">دولار أمريكي ($)</option>
        </select>
      </div>

      <div class="form-group">
        <label>نسبة ضريبة القيمة المضافة الافتراضية</label>
        <input type="number" [(ngModel)]="taxRate" class="form-control" />
      </div>

      <div class="form-group full">
        <label>عنوان المتجر المطبوع على الفاتورة</label>
        <input type="text" [(ngModel)]="storeAddress" class="form-control" />
      </div>

      <div class="form-group full">
        <label>نص تذييل الفاتورة (ملاحظات الاسترجاع)</label>
        <textarea [(ngModel)]="footerNote" rows="3" class="form-control"></textarea>
      </div>
    </div>
  </div>
</div>
