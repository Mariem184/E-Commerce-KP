<div class="new-product-page">
  <!-- Breadcrumb & Title -->
  <div class="breadcrumb-row">
    <a routerLink="/products" class="crumb-link">المنتجات</a>
    <span class="crumb-sep">></span>
    <span class="crumb-current">منتج جديد</span>
  </div>
  <h1 class="page-title">منتج جديد</h1>

  <!-- 8-Step Stepper -->
  <div class="stepper-container">
    <div *ngFor="let step of steps" class="step-item" [class.active]="step.number === currentStep">
      <div class="step-circle">{{ step.number }}</div>
      <span class="step-name">{{ step.title }}</span>
      <div class="step-line" *ngIf="step.number < 8"></div>
    </div>
  </div>

  <!-- Form Card -->
  <div class="form-card">
    <h3 class="card-section-title">المعلومات الأساسية</h3>

    <div class="form-grid-layout">
      <!-- Right Side Column -->
      <div class="form-col">
        <!-- اسم المنتج -->
        <div class="form-field">
          <label class="field-label">اسم المنتج <span class="required">*</span></label>
          <input
            type="text"
            class="field-input"
            [(ngModel)]="productName"
            placeholder="ادخل اسم المنتج"
          />
        </div>

        <!-- العلامة التجارية -->
        <div class="form-field">
          <label class="field-label">العلامة التجارية</label>
          <div class="brand-dotted-box">
            <span>اختر علامة تجارية</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </div>
        </div>

        <!-- الباركود -->
        <div class="form-field">
          <label class="field-label">الباركود</label>
          <input
            type="text"
            class="field-input"
            [(ngModel)]="barcode"
            placeholder="12234534634"
          />
        </div>
      </div>

      <!-- Left Side Column -->
      <div class="form-col">
        <!-- الفئة -->
        <div class="form-field">
          <label class="field-label">الفئة <span class="required">*</span></label>
          <div class="select-wrapper">
            <select class="field-select" [(ngModel)]="category">
              <option value="ملابس رجالي">ملابس رجالي</option>
              <option value="ملابس نسائي">ملابس نسائي</option>
              <option value="أحذية">أحذية</option>
              <option value="إكسسوارات">إكسسوارات</option>
            </select>
            <svg class="select-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </div>
        </div>

        <!-- SKU -->
        <div class="form-field">
          <label class="field-label">SKU</label>
          <input
            type="text"
            class="field-input"
            [(ngModel)]="sku"
            placeholder="SKU - 23131"
          />
        </div>

        <!-- Toggles: تتبع المخزون & نشط -->
        <div class="toggles-row">
          <div class="toggle-item">
            <span class="toggle-text">تتبع المخزون</span>
            <label class="switch">
              <input type="checkbox" [(ngModel)]="trackInventory" />
              <span class="slider"></span>
            </label>
          </div>

          <div class="toggle-item">
            <span class="toggle-text">نشط</span>
            <label class="switch">
              <input type="checkbox" [(ngModel)]="isActive" />
              <span class="slider"></span>
            </label>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation Buttons -->
  <div class="form-bottom-actions">
    <button (click)="goNext()" class="btn-next">
      <span>التالي</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </button>
    <a routerLink="/products" class="btn-cancel">إلغاء</a>
  </div>
</div>
