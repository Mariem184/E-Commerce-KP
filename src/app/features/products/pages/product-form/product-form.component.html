<div class="form-page-container">
  <div class="page-header">
    <a routerLink="/products" class="back-link">← العودة لقائمة المنتجات</a>
    <h2>إضافة منتج جديد</h2>
  </div>

  <div class="form-card">
    <div class="form-grid">
      <div class="form-group full-width">
        <label>اسم المنتج الكامل</label>
        <input type="text" placeholder="مثال: آيفون 16 برو ماكس 256GB تيتانيوم صحراوي" class="input-control" />
      </div>

      <div class="form-group">
        <label>رمز الباركود (Barcode / SKU)</label>
        <input type="text" placeholder="628109923481" class="input-control" />
      </div>

      <div class="form-group">
        <label>التصنيف</label>
        <select class="input-control">
          <option>هواتف ذكية</option>
          <option>إكسسوارات</option>
          <option>أجهزة لوحية</option>
        </select>
      </div>

      <div class="form-group">
        <label>سعر التكلفة (شراء)</label>
        <input type="number" placeholder="0.00" class="input-control" />
      </div>

      <div class="form-group">
        <label>سعر البيع للجمهور</label>
        <input type="number" placeholder="0.00" class="input-control" />
      </div>

      <div class="form-group">
        <label>كمية المخزون الافتتاحية</label>
        <input type="number" placeholder="10" class="input-control" />
      </div>

      <div class="form-group">
        <label>حد الطلب الأدنى للتنبيه</label>
        <input type="number" placeholder="3" class="input-control" />
      </div>
    </div>

    <div class="form-footer">
      <button type="button" class="btn btn-save">حفظ المنتج</button>
      <a routerLink="/products" class="btn btn-cancel">إلغاء</a>
    </div>
  </div>
</div>
